name: spring-boot-configuration-properties

on:
  push:
    paths:
      - '.github/workflows/spring-boot-configuration-properties.yaml'
      - 'spring-boot-configuration-properties/**'
  pull_request:
    paths:
      - '.github/workflows/spring-boot-configuration-properties.yaml'
      - 'spring-boot-configuration-properties/**'
  workflow_dispatch:

jobs:
  test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.5.15', '4.1.0']
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: spring-boot-configuration-properties

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check
        id: gradle_check
        continue-on-error: true
        run: ./gradlew check -PspringBootVersion=${{ matrix.spring-boot }} -PjavaVersion=${{ matrix.java }}

      - name: Annotate Checkstyle violations
        if: always()
        run: python3 ../scripts/annotate_checkstyle.py build/reports/checkstyle

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-configuration-properties-checkstyle-${{ matrix.spring-boot }}-java${{ matrix.java }}
          path: |
            spring-boot-configuration-properties/build/reports/checkstyle

      - name: Fail on check errors
        if: steps.gradle_check.outcome == 'failure'
        run: exit 1
