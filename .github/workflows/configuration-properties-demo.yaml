name: configuration-properties-demo

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/configuration-properties-demo.yaml'
      - 'configuration-properties-demo/**'
  pull_request:
    paths:
      - '.github/workflows/configuration-properties-demo.yaml'
      - 'configuration-properties-demo/**'
  workflow_dispatch:

jobs:
  test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.5.15', '4.0.7', '4.1.0']
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: configuration-properties-demo

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check
        id: gradle_check
        continue-on-error: true
        run: ./gradlew check -PspringBootVersion=${{ matrix.spring-boot }}

      - name: Annotate Checkstyle violations
        if: always()
        run: python3 ../scripts/annotate_checkstyle.py build/reports/checkstyle

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configuration-properties-demo-checkstyle-${{ matrix.spring-boot }}-java${{ matrix.java }}
          path: |
            configuration-properties-demo/build/reports/checkstyle

      - name: Fail on check errors
        if: steps.gradle_check.outcome == 'failure'
        run: exit 1
