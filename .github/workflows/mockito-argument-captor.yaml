name: mockito-argument-captor

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/mockito-argument-captor.yaml'
      - 'mockito-argument-captor/**'
  pull_request:
    paths:
      - '.github/workflows/mockito-argument-captor.yaml'
      - 'mockito-argument-captor/**'
  workflow_dispatch:

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: mockito-argument-captor

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check
        id: gradle_check
        continue-on-error: true
        env:
          JAVA_OPTS: ${{ matrix.java == '25' && '--enable-native-access=ALL-UNNAMED' || '' }}
        run: ./gradlew check -PjavaVersion=${{ matrix.java }}

      - name: Annotate Checkstyle violations
        if: always()
        run: python3 ../scripts/annotate_checkstyle.py build/reports/checkstyle

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mockito-argument-captor-checkstyle-java${{ matrix.java }}
          path: |
            mockito-argument-captor/build/reports/checkstyle

      - name: Fail on check errors
        if: steps.gradle_check.outcome == 'failure'
        run: exit 1
