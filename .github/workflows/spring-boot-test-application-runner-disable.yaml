name: spring-boot-test-application-runner-disable

on:
  push:
    paths:
      - '.github/workflows/spring-boot-test-application-runner-disable.yaml'
      - 'spring-boot-test-application-runner-disable/**'
  pull_request:
    paths:
      - '.github/workflows/spring-boot-test-application-runner-disable.yaml'
      - 'spring-boot-test-application-runner-disable/**'
  workflow_dispatch:

jobs:
  test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.5.14', '4.0.6']
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: spring-boot-test-application-runner-disable

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Test
        run: gradle test -PspringBootVersion=${{ matrix.spring-boot }}
