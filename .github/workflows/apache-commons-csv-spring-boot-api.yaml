name: apache-commons-csv-spring-boot-api

on:
  push:
    paths:
      - '.github/workflows/apache-commons-csv-spring-boot-api.yaml'
      - 'apache-commons-csv-spring-boot-api/**'
  pull_request:
    paths:
      - '.github/workflows/apache-commons-csv-spring-boot-api.yaml'
      - 'apache-commons-csv-spring-boot-api/**'
  workflow_dispatch:

jobs:
  test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.5.14', '4.0.6', '4.1.0']
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: apache-commons-csv-spring-boot-api

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test -PspringBootVersion=${{ matrix.spring-boot }}
