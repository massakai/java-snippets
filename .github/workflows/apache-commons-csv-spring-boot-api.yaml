name: apache-commons-csv-spring-boot-api

on:
  push:
    paths:
      - '.github/workflows/apache-commons-csv-spring-boot-api.yaml'
      - 'apache-commons-csv-spring-boot-api/**'
  pull_request:
    paths:
      - '.github/workflows/apache-commons-csv-spring-boot-api.yaml'
      - 'apache-commons-csv-spring-boot-api/**'
  workflow_dispatch:

jobs:
  test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.5.14', '4.0.6', '4.1.0']
        java: ['17', '21', '25']

    defaults:
      run:
        working-directory: apache-commons-csv-spring-boot-api

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check
        id: gradle_check
        continue-on-error: true
        env:
          JAVA_OPTS: ${{ matrix.java == '25' && '--enable-native-access=ALL-UNNAMED' || '' }}
        run: ./gradlew check -PspringBootVersion=${{ matrix.spring-boot }}

      - name: Annotate Checkstyle violations
        if: always()
        run: python3 ../scripts/annotate_checkstyle.py build/reports/checkstyle

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apache-commons-csv-spring-boot-api-checkstyle-${{ matrix.spring-boot }}-java${{ matrix.java }}
          path: |
            apache-commons-csv-spring-boot-api/build/reports/checkstyle

      - name: Fail on check errors
        if: steps.gradle_check.outcome == 'failure'
        run: exit 1
