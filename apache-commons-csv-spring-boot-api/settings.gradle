pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }

    def springBootVersion = providers.gradleProperty('springBootVersion').getOrElse('3.5.14')

    plugins {
        id 'org.springframework.boot' version springBootVersion
        id 'io.spring.dependency-management' version '1.1.7'
    }
}

rootProject.name = 'apache-commons-csv-spring-boot-api'
